name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run sim:smoke
      - run: npm run build

  e2e:
    name: Playwright (E2E + visual)
    runs-on: ubuntu-latest
    needs: checks
    # Same image as the visual baselines, so screenshots compare pixel-exactly.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: End-to-end tests (Chromium desktop + mobile)
        run: npm run test:e2e
      - name: Visual regression
        run: npm run test:visual
      - name: Upload reports and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            reports/
            test-results/
          retention-days: 14
